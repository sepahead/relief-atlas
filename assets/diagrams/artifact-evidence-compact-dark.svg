<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1384" viewBox="0 0 480 1384" role="img" aria-labelledby="title description">
<title id="title">From files to release membership</title>
<desc id="description">Release eligibility has three distinct layers. Committed files include a PNG with matching image metadata and a GLB, recognized Gaussian container and geometry metadata. Image metadata binds the configured model and PNG hash; geometry records the actual source PNG hash. Current image, mesh and Gaussian QA must bind the inspected file hashes and current QA contract, including the required safety screen. Positive release membership additionally requires default policy eligibility, no override or quarantine and a complete deliverable. The local release manifest records included IDs and file hashes. The controller completes only when every saved target is included. Visual fidelity, metric scale, collision quality and physics suitability need separate review.</desc>
