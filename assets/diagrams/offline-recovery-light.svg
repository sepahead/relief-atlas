<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="992" viewBox="0 0 1120 992" role="img" aria-labelledby="title description">
<title id="title">Recovery follows saved evidence</title>
<desc id="description">The latest saved Start, Resume or Pause command controls the managed worker. Pause saves paused intent before stopping owned children; Status only reads saved state. Resume verifies the saved plan, artifact hashes and current QA. Missing references are generated; a committed image with incomplete geometry keeps its image and rebuilds the complete 3D stage; complete geometry with missing QA is inspected; current passes still need positive release membership for every saved target. Resource waits recheck automatically. A crashed worker can restart within the logged-in session if intent is running. After reboot, user login is also required. Unresolved prerequisites, changed snapshots, exhausted failures and quarantine need attention. An interrupted sampling stage restarts; completed hash-verified commits are reused.</desc>
