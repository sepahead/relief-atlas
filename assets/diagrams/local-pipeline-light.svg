<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="836" viewBox="0 0 1120 836" role="img" aria-labelledby="title description">
<title id="title">One item, one traceable pipeline</title>
<desc id="description">The atlas-managed offline pipeline freezes policy-screened manifest rows and settings. Qwen-Image-2.1 produces an RGBA reference: native alpha is preserved, while opaque output uses BiRefNet or chroma matting. Image QA and the required safety screen gate TRELLIS.2-4B, which uses DINOv3 conditioning and a trained structure decoder. Its shared decoded mesh and voxel attributes feed both a textured Y-up GLB and native Z-up Gaussians, usually SPZ with SPLAT fallback. Mesh and Gaussian QA are separate required gates. A separate audit determines release membership. The arrows describe data flow, not parallel execution.</desc>
